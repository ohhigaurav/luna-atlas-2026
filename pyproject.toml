[project]
name = "lunar-south-pole-mission-planner"
version = "0.7.60.dev0"
description = "Auditable lunar south-pole lighting and DTE mission planner science-core and local-first web application"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "Project team" }]
dependencies = [
  "fastapi==0.128.2",
  "numpy==2.3.5",
  "pydantic==2.13.5",
  "pyproj==3.7.2",
  "rasterio==1.5.0",
  "scipy==1.17.0",
  "spiceypy==8.3.0",
  "uvicorn==0.48.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.2",
  "mypy==2.4.0",
  "ruff==0.17.2",
]
# Only for tools/make_demo_video.py (the 30 s demo video): uv sync --group video
video = ["pillow==12.3.0"]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/lunar_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["lunar_core"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set so results do not change when ruff's defaults change between versions:
# pyflakes, pycodestyle errors, import order, pyupgrade and bugbear.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "backend"

# Third-party scientific packages without bundled type information. Listing them here keeps
# `mypy --strict` usable without installing stub packages that would pull a different NumPy.
[[tool.mypy.overrides]]
module = ["scipy.*", "rasterio.*", "spiceypy.*", "pyproj.*", "affine.*", "openpyxl.*"]
ignore_missing_imports = true
